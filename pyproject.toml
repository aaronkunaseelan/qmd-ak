[project]
name = "qmd2"
version = "0.1.0"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = ["tantivy==0.26.2", "zstandard", "boto3"]

[project.scripts]
qmd2 = "qmd2.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
python-preference = "only-system"
no-index = true
find-links = ["vendor"]
environments = ["sys_platform == 'linux' and platform_machine == 'aarch64'"]

[tool.hatch.build.targets.wheel.force-include]
"vendor/defuddle.cjs" = "qmd2/defuddle.cjs"

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "preserve"
